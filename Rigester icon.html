<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="Rigester.css">
</head>
<body>

   <form action="thankyou.html">

     <div class="form-container">
        <h2>Register</h2>
        
        <input placeholder="First name" type="text" maxlength="15" minlength="2" required>
        <input placeholder="Second name" type="text" maxlength="15" minlength="2" required>
        <input type="date" required>
        <input placeholder="Please enter your email" type="email" maxlength="30" minlength="5" required>
        <input placeholder="Please enter your phone number" type="tel" maxlength="15" minlength="10" required>
        <input placeholder="Please enter your car model" type="text" maxlength="12" minlength="3" required>
        
        <button type="submit">
            <a href="thankyou.html">Register</a>
        </button>
    </div>
   </form>

</body>
</html>
